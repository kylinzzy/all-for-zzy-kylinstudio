name: 猫眼每2小时更新（headless 浏览器）

# 主触发：CloudBase 定时云函数每 2 小时调 workflow_dispatch；schedule 仅兜底（免费版不可靠）
on:
  schedule:
    - cron: '47 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: maoyan
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 Playwright 浏览器（命中后免下载 ~170MB Chromium）
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium

      - name: 安装 Playwright
        run: |
          npm install playwright --no-fund --no-audit
          npx playwright install --with-deps chromium

      - name: 采集猫眼（headless 浏览器）
        # 猫眼被反爬拦截时也不连累芒果TV数据（保留上次有效 maoyan_data.json）
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
        run: |
          node collect_maoyan_cloud.js /tmp/maoyan_raw.json
          python3 build_maoyan.py /tmp/maoyan_raw.json

      - name: 导出 site/data.json
        env:
          TZ: Asia/Shanghai
        run: python3 export_site.py

      - name: 提交并推送
        # push 仅用于触发 Cloudflare 备份部署/留档；与芒果TV通道并发抢推可能冲突。
        # 部署用的是本地刚采集的文件，push 失败绝不连累部署。
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/kylinzzy/all-for-zzy-kylinstudio.git"
          git add episode_data.json site/data.json site/maoyan_data.json site/index.html
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: maoyan $(date '+%Y-%m-%d %H:%M %Z')"
            git pull --rebase --no-edit origin main || true
            git push origin main
            echo "已推送"
          fi

      - name: 部署到 Cloudflare Pages（备份镜像，失败不阻断主站）
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@latest pages deploy site --project-name=room8-tracker-22

      - name: 部署到 CloudBase 静态托管（主站，恒执行）
        env:
          CLOUDBASE_SECRET_ID: ${{ secrets.CLOUDBASE_SECRET_ID }}
          CLOUDBASE_SECRET_KEY: ${{ secrets.CLOUDBASE_SECRET_KEY }}
          CLOUDBASE_ENV_ID: kylinzzy-d9g7dtcpc796ae106
        run: |
          npx -y -p @cloudbase/cli tcb login --apiKeyId "$CLOUDBASE_SECRET_ID" --apiKey "$CLOUDBASE_SECRET_KEY"
          npx -y -p @cloudbase/cli tcb hosting deploy site -e "$CLOUDBASE_ENV_ID"

      - name: 清除 jsDelivr CDN 缓存
        if: success()
        run: |
          sleep 10
          curl -sS --max-time 40 "https://purge.jsdelivr.net/gh/kylinzzy/all-for-zzy-kylinstudio@main/site/data.json" || true
          curl -sS --max-time 40 "https://purge.jsdelivr.net/gh/kylinzzy/all-for-zzy-kylinstudio@main/site/maoyan_data.json" || true

name: 每小时更新播放数据

on:
  schedule:
    # UTC 每小时第 17 分 = 北京时间每小时第 25 分（避开整点高峰）
    - cron: '17 * * * *'
  workflow_dispatch: {}   # 允许手动触发，便于验证

# 允许本 workflow 推送代码回仓库
permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false   # 不取消正在跑的，避免丢失更新

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 采集芒果TV播放量
        env:
          TZ: Asia/Shanghai
        run: |
          for i in 1 2 3; do
            echo "== 芒果TV 采集尝试 $i/3 =="
            python3 collect_mgtv_api.py collect && break
            echo "采集失败，5s 后重试"
            sleep 5
          done

      - name: 采集猫眼专业版数据
        env:
          TZ: Asia/Shanghai
        run: |
          for i in 1 2 3; do
            echo "== 猫眼 采集尝试 $i/3 =="
            python3 collect_maoyan_api.py && break
            echo "采集失败，5s 后重试"
            sleep 5
          done

      - name: 导出 site/data.json
        env:
          TZ: Asia/Shanghai
        run: |
          echo "== 导出 data.json =="
          python3 export_site.py

      - name: 提交并推送
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/kylinzzy/all-for-zzy-kylinstudio.git"
          git add episode_data.json site/data.json site/index.html
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 自动更新 $(date '+%Y-%m-%d %H:%M %Z')"
            git pull --rebase --no-edit origin main || true
            git push origin main
            echo "已推送"
          fi

      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@latest
          wrangler pages deploy site --project-name=room8-tracker-22

      - name: 清除 jsDelivr CDN 缓存
        if: success()
        run: |
          sleep 10   # 等 GitHub 端一致后再清，否则会缓存到旧内容
          curl -sS --max-time 40 "https://purge.jsdelivr.net/gh/kylinzzy/all-for-zzy-kylinstudio@main/site/data.json" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('purge status:',d.get('status'))" \
            || echo "purge 请求失败（不影响，下一小时会自然生效）"

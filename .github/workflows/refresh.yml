name: 每小时更新播放数据

on:
  schedule:
    # UTC 每小时第 17 分 = 北京时间每小时第 25 分（避开整点高峰）
    - cron: '17 * * * *'
  workflow_dispatch: {}   # 允许手动触发，便于验证

# 允许本 workflow 推送代码回仓库
permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true   # 新触发直接顶掉旧运行，避免定时任务在并发队列里被丢弃

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Playwright + Chromium
        # 猫眼专业版需浏览器绕过 mtgsig 签名（H5guard 在 headless 下不拦，已验证）
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: 采集芒果TV播放量
        env:
          TZ: Asia/Shanghai
        run: python3 collect_mgtv_api.py collect

      - name: 采集猫眼专业版（headless 浏览器）
        continue-on-error: true   # 猫眼被反爬拦截时也不连累芒果TV数据部署
        env:
          TZ: Asia/Shanghai
        run: |
          node collect_maoyan_cloud.js /tmp/maoyan_raw.json
          python3 build_maoyan.py /tmp/maoyan_raw.json

      - name: 导出 site/data.json
        env:
          TZ: Asia/Shanghai
        run: python3 export_site.py

      - name: 提交并推送
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/kylinzzy/all-for-zzy-kylinstudio.git"
          git add episode_data.json site/data.json site/maoyan_data.json site/index.html
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 自动更新 $(date '+%Y-%m-%d %H:%M %Z')"
            git pull --rebase --no-edit origin main || true
            git push origin main
            echo "已推送"
          fi

      - name: 部署到 Cloudflare Pages（备份镜像，失败不阻断主站）
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@latest pages deploy site --project-name=room8-tracker-22

      - name: 部署到 CloudBase 静态托管
        # 凭据已常驻仓库 Secrets，恒执行；失败不阻断 Cloudflare 镜像
        env:
          CLOUDBASE_SECRET_ID: ${{ secrets.CLOUDBASE_SECRET_ID }}
          CLOUDBASE_SECRET_KEY: ${{ secrets.CLOUDBASE_SECRET_KEY }}
          CLOUDBASE_ENV_ID: kylinzzy-d9g7dtcpc796ae106
        run: |
          npx -y -p @cloudbase/cli tcb login --apiKeyId "$CLOUDBASE_SECRET_ID" --apiKey "$CLOUDBASE_SECRET_KEY"
          npx -y -p @cloudbase/cli tcb hosting deploy site -e "$CLOUDBASE_ENV_ID"

      - name: 清除 jsDelivr CDN 缓存
        if: success()
        run: |
          sleep 10   # 等 GitHub 端一致后再清，否则会缓存到旧内容
          curl -sS --max-time 40 "https://purge.jsdelivr.net/gh/kylinzzy/all-for-zzy-kylinstudio@main/site/data.json" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('purge status:',d.get('status'))" \
            || echo "purge 请求失败（不影响，下一小时会自然生效）"

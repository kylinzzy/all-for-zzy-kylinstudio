<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密室大逃脱第8季 - 实时数据看板</title>
<style>
:root {
  --bg: #0c1712;
  --card-bg: #14211c;
  --card-border: #2a3a30;
  --text: #e4e6f0;
  --text-muted: #8b8fa3;
  --accent: #16a34a;
  --accent-light: #4ade80;
  --accent-deep: #15803d;
  --green: #4ade80;
  --yellow: #fbbf24;
  --red: #f87171;
  --blue: #60a5fa;
  --info: #38bdf8;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  padding: 20px; min-height: 100vh;
}
.container { max-width:1200px; margin:0 auto; }
.header { text-align:center; padding:30px 0 25px; border-bottom:1px solid var(--card-border); margin-bottom:28px; }
.header h1 { font-size:26px; font-weight:700; letter-spacing:1px;
  background:linear-gradient(135deg, var(--accent), var(--accent-light));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.header .subtitle { color:var(--text-muted); font-size:13px; margin-top:6px; }
.header .refresh-time { color:var(--text-muted); font-size:12px; margin-top:4px; }
.card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:10px; padding:18px; margin-bottom:16px; }
.card-header { font-size:15px; font-weight:600; color:var(--accent-light); padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid var(--card-border); }
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:14px; margin-bottom:24px; }
.kpi-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:10px; padding:18px; text-align:center; transition:transform .2s, border-color .2s; }
.kpi-card:hover { transform:translateY(-2px); border-color:var(--accent); }
.kpi-value { font-size:30px; font-weight:700; line-height:1.2; }
.kpi-label { font-size:12px; color:var(--text-muted); margin-top:4px; }
.kpi-value.purple { color:var(--accent-light); } .kpi-value.green { color:var(--green); }
.kpi-value.blue { color:var(--blue); } .kpi-value.yellow { color:var(--yellow); } .kpi-value.red { color:var(--red); }
.table { width:100%; border-collapse:collapse; font-size:13px; }
.table th { text-align:left; padding:8px 10px; border-bottom:1px solid var(--card-border); color:var(--text-muted); font-weight:500; font-size:12px; white-space:nowrap; }
.table td { padding:8px 10px; border-bottom:1px solid rgba(42,45,56,0.5); vertical-align:middle; }
.table tbody tr:hover { background:rgba(22,163,74,0.08); }
.text-muted { color:var(--text-muted); }

/* ===== 同比对比表：四向冻结（首2列 + 表头 + 表尾） ===== */
.sc-card {
  overflow:auto;
  max-height:68vh;
  border:1px solid var(--card-border);
  border-radius:8px;
  background:var(--card-bg);
}
.sc-header, .sc-row, .sc-summary-row {
  display:grid;
  gap:0;
}
.sc-header {
  position:sticky;
  top:0;
  z-index:4;
  background:var(--card-bg);
  border-bottom:1px solid var(--card-border);
}
.sc-header .sc-cell { font-size:12px; color:var(--text-muted); font-weight:500; }
.sc-row { border-bottom:1px solid rgba(42,45,56,0.5); }
.sc-row:hover { background:rgba(22,163,74,0.08); }
.sc-row:hover .sc-cell.col-fixed { background:rgba(22,163,74,0.18); }
.sc-cell {
  padding:8px 10px;
  font-size:13px;
  white-space:nowrap;
  white-space:nowrap;
  text-align:left;
  background:var(--card-bg);
  box-sizing:border-box;
}
.sc-cell.col-fixed {
  position:sticky;
  left:0;
  z-index:3;
  font-weight:500;
  border-right:1px solid var(--card-border);
}
.sc-cell.col-s8 {
  position:sticky;
  left:152px;
  z-index:3;
  color:var(--accent-light);
  font-weight:600;
  background:rgba(22,163,74,0.20);
  border-right:1px solid var(--card-border);
}
.sc-summary-row {
  position:sticky;
  bottom:0;
  z-index:4;
  background:var(--card-bg);
  border-top:2px solid var(--accent-deep);
}
.sc-summary-row .sc-cell { font-weight:700; font-size:13px; }
.sc-header .sc-cell.col-fixed, .sc-header .sc-cell.col-s8,
.sc-summary-row .sc-cell.col-fixed, .sc-summary-row .sc-cell.col-s8 { z-index:5; }
.badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:500; }
.badge-success { background:rgba(52,211,153,0.15); color:var(--green); }
.badge-info { background:rgba(56,189,248,0.15); color:var(--info); }
.badge-secondary { background:rgba(139,143,163,0.15); color:var(--text-muted); }
.badge-update { background:rgba(251,191,36,0.15); color:var(--yellow); }
.badge-main { background:rgba(22,163,74,0.18); color:var(--accent-light); }
.badge-vip { background:rgba(251,191,36,0.12); color:var(--yellow); }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media(max-width:800px){ .grid-2 { grid-template-columns:1fr; } }
.timeline { position:relative; padding-left:20px; }
.timeline::before { content:''; position:absolute; left:6px; top:0; bottom:0; width:2px; background:var(--card-border); }
.tl-item { position:relative; padding:0 0 16px 14px; }
.tl-item::before { content:''; position:absolute; left:-20px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px rgba(22,163,74,0.25); }
.tl-date { font-size:12px; color:var(--info); font-weight:600; }
.tl-event { font-size:13px; font-weight:600; margin:2px 0; }
.tl-detail { font-size:12px; color:var(--text-muted); }
.footer { text-align:center; color:var(--text-muted); font-size:12px; padding:24px 0; }
.rank-num { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; font-size:12px; font-weight:700; }
.rank-1 { background:linear-gradient(135deg,#fbbf24,#f59e0b); color:#1a1d27; }
.rank-2 { background:linear-gradient(135deg,#cbd5e1,#94a3b8); color:#1a1d27; }
.rank-3 { background:linear-gradient(135deg,#d97706,#b45309); color:#fff; }
.rank-n { background:rgba(139,143,163,0.15); color:var(--text-muted); }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
.dot-green { background:var(--green); } .dot-yellow { background:var(--yellow); } .dot-muted { background:var(--text-muted); }

/* ===== 装饰元素：鸢尾花 + 绿蝶 ===== */
.header-deco { position:relative; }
.deco-iris, .deco-butterfly { position:absolute; pointer-events:none; opacity:.18; }
.deco-iris { top:-15px; right:-10px; width:70px; height:70px; }
.deco-butterfly { bottom:-12px; left:-10px; width:55px; height:55px; transform:rotate(-15deg); }

/* ===== 荣誉时刻 ===== */
.honor-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px; }
.honor-card { background:linear-gradient(135deg, rgba(22,163,74,0.10), rgba(74,222,128,0.04)); border:1px solid rgba(22,163,74,0.30); border-radius:10px; padding:16px; text-align:center; }
.honor-num { font-size:36px; font-weight:700; color:var(--accent-light); line-height:1.1; }
.honor-label { font-size:12px; color:var(--text-muted); margin-top:4px; }
.honor-sub { font-size:11px; color:var(--info); margin-top:2px; }
.bt-list { margin-top:6px; text-align:left; }
.bt-item { display:flex; align-items:center; justify-content:space-between; padding:5px 8px; border-radius:6px; font-size:12px; margin-bottom:3px; background:rgba(22,163,74,0.07); }
.bt-item .bt-yi { font-weight:700; color:var(--accent-light); font-size:13px; min-width:60px; }
.bt-item .bt-date { color:var(--text-muted); font-size:11px; }
@media(max-width:700px){ .honor-grid { grid-template-columns:1fr; } }

#loading { text-align:center; padding:60px; color:var(--text-muted); }
#error { display:none; text-align:center; padding:40px; color:var(--red); }

/* ===== 密室大王来了：3 个可点击大图标（统一圆形真实图片） ===== */
.links-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
@media(max-width:780px){ .links-grid { grid-template-columns:1fr; } }
.link-card {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px 12px 16px;
  border-radius:12px;
  background:linear-gradient(135deg, rgba(22,163,74,0.10), rgba(74,222,128,0.04));
  border:1px solid rgba(22,163,74,0.30);
  text-decoration:none;
  color:var(--text);
  transition:transform .18s ease, border-color .18s ease, background .18s ease;
}
.link-card:hover { transform:translateY(-3px); border-color:var(--accent); background:linear-gradient(135deg, rgba(22,163,74,0.20), rgba(74,222,128,0.10)); }
.link-card .link-img {
  width:64px; height:64px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin-bottom:10px;
  border:2px solid rgba(22,163,74,0.45);
  background:rgba(22,163,74,0.04);
  transition:transform .18s ease, border-color .18s ease;
}
.link-card:hover .link-img { transform:scale(1.06); border-color:var(--accent-light); }
.link-card .link-name {
  font-size:15px; font-weight:700; color:var(--accent-light); letter-spacing:1px;
  margin-bottom:2px;
}
.link-card .link-sub {
  font-size:11px; color:var(--text-muted); letter-spacing:.5px;
}

/* ==== 双列滚动框（统一左右高度）==== */
.scroll-420{
  max-height:420px;
  overflow-y:auto;
  padding-right:4px;
}
@media(max-height:760px){
  .scroll-420{ max-height:320px; }
}
@media(max-height:600px){
  .scroll-420{ max-height:240px; }
}
</style>
</head>
<body>
<div class="container">
  <div id="loading">正在加载最新数据…</div>
  <div id="error">⚠️ 数据加载失败，请刷新页面重试</div>
  <div id="app" style="display:none"></div>
  <div class="footer" id="footer"></div>
</div>
<script>
const REFRESH_SEC = 120;
function fmtWan(wan){
  if(wan==null) return '-';
  if(wan>=10000) return (wan/10000).toFixed(2).replace(/\.?0+$/,'')+'亿';
  return wan.toFixed(1)+'万';
}
function fmtPlays(wan){
  if(wan==null) return '-';
  if(wan>=10000) return (wan/10000).toFixed(2).replace(/\.?0+$/,'')+'亿次播放';
  return wan.toFixed(1)+'万次播放';
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
// 万 -> 亿（同比表统一以「亿次」为单位）
function fmtYi(wan){
  if(wan==null) return '-';
  const yi = wan/10000;
  return yi.toFixed(2).replace(/\.?0+$/,'') + '亿';
}

// ---------- 多源数据加载 ----------
// 同时向多个数据源请求，全部返回后比较 last_collect_time，采用最新的一份。
// 任一源被墙 / 超时 / 缓存过旧，都不影响页面拿到最新数据。
const GH_USER = 'kylinzzy';
const GH_REPO = 'all-for-zzy-kylinstudio';

// 常规源：CDN 多边缘 + Raw + 本地兜底。不同边缘缓存进度不同，取最新那份。
const SOURCES = [
  { name: 'jsDelivr',        url: () => `https://cdn.jsdelivr.net/gh/${GH_USER}/${GH_REPO}@main/site/data.json?t=${Date.now()}` },
  { name: 'jsDelivr-gcore',  url: () => `https://gcore.jsdelivr.net/gh/${GH_USER}/${GH_REPO}@main/site/data.json?t=${Date.now()}` },
  { name: 'jsDelivr-fastly', url: () => `https://fastly.jsdelivr.net/gh/${GH_USER}/${GH_REPO}@main/site/data.json?t=${Date.now()}` },
  { name: 'GitHub Raw',      url: () => `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/site/data.json?t=${Date.now()}` },
  { name: '本地快照',         url: () => `./data.json?t=${Date.now()}` }
];

// 权威源：GitHub API，无 CDN 缓存（60s）永远最新，但未认证限流 60次/小时/IP，
// 因此只在首次加载和每 5 次轮询时使用一次，避免耗尽额度。
const API_SOURCE = {
  name: 'GitHub API',
  url: () => `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/site/data.json?ref=main&t=${Date.now()}`,
  headers: { 'Accept': 'application/vnd.github.raw' }
};

// ---------- 猫眼独立数据源（本机浏览器每小时采集后单独推送）----------
// 云端 Actions 受猫眼反爬(WAF)限制无法采集猫眼，故猫眼数据由本机通道推送 maoyan_data.json，
// 前端拉取后覆盖 data.json 中的猫眼相关字段，与 Actions 推送的芒果TV数据互不冲突。
const MAOYAN_SOURCES = [
  { name: 'jsDelivr',        url: () => `https://cdn.jsdelivr.net/gh/${GH_USER}/${GH_REPO}@main/site/maoyan_data.json?t=${Date.now()}` },
  { name: 'jsDelivr-gcore',  url: () => `https://gcore.jsdelivr.net/gh/${GH_USER}/${GH_REPO}@main/site/maoyan_data.json?t=${Date.now()}` },
  { name: 'jsDelivr-fastly', url: () => `https://fastly.jsdelivr.net/gh/${GH_USER}/${GH_REPO}@main/site/maoyan_data.json?t=${Date.now()}` },
  { name: 'GitHub Raw',      url: () => `https://raw.githubusercontent.com/${GH_USER}/${GH_REPO}/main/site/maoyan_data.json?t=${Date.now()}` },
  { name: '本地快照',         url: () => `./maoyan_data.json?t=${Date.now()}` }
];
const MAOYAN_API_SOURCE = {
  name: 'GitHub API',
  url: () => `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/site/maoyan_data.json?ref=main&t=${Date.now()}`,
  headers: { 'Accept': 'application/vnd.github.raw' }
};

let MAOYAN_INFO = null;  // 猫眼新鲜度信息：{status, last_update, badge}

async function fetchMaoyan(){
  const list = MAOYAN_SOURCES.slice();
  if(TICK_COUNT % 5 === 0) list.push(MAOYAN_API_SOURCE);
  const results = await Promise.allSettled(list.map(s => fetchOne(s, 9000)));
  const ok = results.filter(r => r.status === 'fulfilled').map(r => r.value);
  if(!ok.length) return null;
  ok.sort((a, b) => ((b.data&&b.data.meta&&b.data.meta.last_collect_time)||'').localeCompare((a.data&&a.data.meta&&a.data.meta.last_collect_time)||''));
  return ok[0].data;
}

function applyMaoyan(d, md){
  if(!md) return d;
  const ps = md.platform_summary || {};
  const dps = d.platform_summary || (d.platform_summary = {});
  if(ps.cumulative_yi != null) dps.cumulative_yi = ps.cumulative_yi;
  if(ps.cumulative_wan != null) dps.cumulative_wan = ps.cumulative_wan;
  if(ps.yesterday_plays_yi != null) dps.yesterday_plays_yi = ps.yesterday_plays_yi;
  if(ps.today_realtime_wan != null) dps.today_realtime_wan = ps.today_realtime_wan;
  if(ps.data_source) dps.data_source = ps.data_source;
  if(ps.last_update) dps.last_update = ps.last_update;
  if(ps.data_status) dps.data_status = ps.data_status;
  if(md.daily_platform_plays && Object.keys(md.daily_platform_plays).length){
    d.daily_platform_plays = md.daily_platform_plays;
  }
  if(Array.isArray(md.daily) && md.daily.length){
    d.daily = md.daily;
  }
  if(md.honor_moments) d.honor_moments = md.honor_moments;
  const lu = ps.last_update || (md.meta && md.meta.last_collect_time) || '';
  const shortLu = lu ? lu.replace(/^\d{4}-/, '') : '未知';
  const status = ps.data_status || 'normal';
  const dotColor = status === 'normal' ? '#34d399' : '#fbbf24';
  const label = status === 'normal' ? '本机自动采集' : '采集暂停';
  MAOYAN_INFO = {
    status, last_update: lu,
    badge: `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;color:${dotColor};">
              <span style="width:7px;height:7px;border-radius:50%;background:${dotColor};display:inline-block;"></span>
              ${esc(label)} · 更新 ${esc(shortLu)}</span>`
  };
  return d;
}

let LAST_SOURCE = '-';
let TICK_COUNT = 0;

function fetchOne(src, timeoutMs){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  const opts = { cache: 'no-store', signal: ctl.signal };
  if(src.headers) opts.headers = src.headers;
  return fetch(src.url(), opts)
    .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(j => ({ src: src.name, data: j, ts: (j && j.meta && j.meta.last_collect_time) || '' }))
    .finally(() => clearTimeout(timer));
}

async function load(){
  const list = SOURCES.slice();
  // 首次加载 + 每 5 次轮询，additionally 查一次权威源，确保不会长时间停留在 CDN 旧缓存
  if(TICK_COUNT % 5 === 0) list.push(API_SOURCE);
  TICK_COUNT++;

  const results = await Promise.allSettled(list.map(s => fetchOne(s, 9000)));
  const ok = results.filter(r => r.status === 'fulfilled').map(r => r.value);
  if(!ok.length) throw new Error('全部数据源均不可用');
  // 取采集时间最新的一份，彻底规避各 CDN 边缘缓存进度不一致的问题
  ok.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
  LAST_SOURCE = ok[0].src;
  return ok[0].data;
}

function render(d){
  const m = d.meta||{};
  const eps = (d.episodes||[]).slice().sort((a,b)=>b.plays_wan-a.plays_wan);
  let daily = d.daily||[];
  // 兼容：若 daily 为空但 daily_platform_plays 有数据，自动转换
  // 兼容嵌套结构 {data:{日期:{...}}} 与扁平结构 {日期:{...}} 两种来源
  if(!daily.length && d.daily_platform_plays){
    const weekdayMap=['日','一','二','三','四','五','六'];
    const src = (d.daily_platform_plays.data && typeof d.daily_platform_plays.data==='object')
      ? d.daily_platform_plays.data
      : d.daily_platform_plays;
    daily = Object.entries(src)
      .filter(([k])=>/^\d{4}-\d{2}-\d{2}$/.test(k))
      .map(([date,val])=>{
        const pd = (val && typeof val==='object') ? val : {};
        const pw = (typeof val==='number') ? val : (pd.plays_wan||0);
        const dt = new Date(date.replace(/-/g,'/'));
        return {
          date,
          weekday: pd.weekday || ('星期'+weekdayMap[dt.getDay()]),
          plays_wan: parseFloat(pw)||0,
          is_update: !!pd.is_update,
          note: pd.note||''
        };
      })
      .sort((a,b)=>b.date.localeCompare(a.date));
  }
  const hist = (d.historical_milestones||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));  // 时间倒序
  const ms = d.milestones||[];
  const ps = d.platform_summary||{};

  const confirmedNodes = ms.filter(x=>x.status==='confirmed').length;
  const covered = eps.filter(e=>e.plays_wan>0).length;

  let html = '';
  html += `<div class="header header-deco">
    <!-- 鸢尾花 SVG 装饰 -->
    <svg class="deco-iris" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 10 C30 10 15 30 20 50 C10 45 5 65 15 78 C12 88 28 95 40 88 C48 98 68 96 75 85 C88 92 98 78 90 65 C100 55 90 35 78 32 C82 18 65 8 50 10Z" fill="#7c3aed" opacity=".6"/>
      <path d="M50 25 C38 25 28 38 32 52 C24 49 21 62 28 72 C26 79 37 84 46 79 C51 86 64 84 70 77 C79 82 87 72 82 63 C89 56 82 42 74 40 C77 30 65 23 50 25Z" fill="#a78bfa" opacity=".4"/>
      <path d="M50 45 L50 92" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="50" cy="93" rx="10" ry="3" fill="#a78bfa" opacity=".3"/>
      <path d="M50 60 Q35 50 25 58 Q30 45 50 55 Q70 45 75 58 Q65 50 50 60Z" fill="#34d399" opacity=".35"/>
    </svg>
    <!-- 绿蝶 SVG 装饰 -->
    <svg class="deco-butterfly" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 38 C35 20 10 22 8 42 C6 58 30 62 48 44Z" fill="#34d399" opacity=".5"/>
      <path d="M50 38 C65 18 92 20 94 40 C96 58 72 64 52 44Z" fill="#10b981" opacity=".4"/>
      <path d="M50 38 C42 48 36 66 38 72C40 76 46 74 48 66C50 58 50 48 50 38Z" fill="#059669" opacity=".3"/>
      <path d="M50 38 C58 47 64 65 62 71C60 75 54 73 52 65C50 57 50 48 50 38Z" fill="#059669" opacity=".3"/>
      <ellipse cx="50" cy="37" rx="3" ry="8" fill="#047857" opacity=".5"/>
      <path d="M50 29 C48 22 44 16 42 14" stroke="#34d399" stroke-width="1.2" stroke-linecap="round" opacity=".6"/>
      <path d="M50 29 C52 22 56 16 58 14" stroke="#34d399" stroke-width="1.2" stroke-linecap="round" opacity=".6"/>
    </svg>
    <h1>密室大逃脱第8季 · 实时数据看板</h1>
    <div class="subtitle" style="margin-top:2px;color:var(--accent-light);font-size:14px;font-weight:500;">张真源专属密室数据看板</div>
    <div class="refresh-time">最近采集：${esc(m.last_collect_time)} · 数据生成：${esc(m.generated_at)}</div>
  </div>`;

  html += `<div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-value purple">${fmtWan(m.total_wan)}</div><div class="kpi-label">全站合计播放量</div></div>
    <div class="kpi-card"><div class="kpi-value green">${(ps.cumulative_yi!=null?ps.cumulative_yi+'亿':'-')}</div><div class="kpi-label">平台累计(猫眼)</div>${MAOYAN_INFO?`<div style="margin-top:3px;">${MAOYAN_INFO.badge}</div>`:''}</div>
    <div class="kpi-card"><div class="kpi-value blue">${(d.seasons_compare&&d.seasons_compare.rows?((d.seasons_compare.rows.find(r=>r.summary==='avg')||{}).plays||{})['第8季']:null)!=null?fmtYi(d.seasons_compare.rows.find(r=>r.summary==='avg').plays['第8季']):'-'}</div><div class="kpi-label">第8季集均</div></div>
    <div class="kpi-card"><div class="kpi-value yellow">${ms.length}</div><div class="kpi-label">单集5000万节点</div></div>
  </div>`;

  html += `<div class="grid-2">
    <div class="card"><div class="card-header">全集播放量排行</div><div class="scroll-420"><table class="table"><thead><tr><th>#</th><th>集数</th><th>播放量</th></tr></thead><tbody>`;
  eps.forEach((e,i)=>{
    const rank = i<3?('rank-'+(i+1)):'rank-n';
    const isMain = (e.name&&e.name.indexOf('第')===0);
    const main = isMain?'<span class="badge badge-main">正片</span>':'';
    const launch = e.launch ? `<span class="text-muted" style="font-size:11px;margin-left:4px;">${esc(e.launch)}</span>` : '';
    html += `<tr><td><span class="rank-num ${rank}">${i+1}</span></td>
      <td>${esc(e.name)} ${main}${launch}</td>
      <td>${fmtPlays(e.plays_wan)}</td></tr>`;
  });
  html += `</tbody></table></div></div>`;

  html += `<div class="card"><div class="card-header">每日平台播放量(猫眼) ${MAOYAN_INFO?MAOYAN_INFO.badge:''}</div>
    <div class="scroll-420"><table class="table"><thead><tr><th>日期</th><th>星期</th><th>播放量</th><th>备注</th></tr></thead><tbody>`;
  // 按日期倒序展示：最新日期在最上面
  daily.slice().reverse().forEach(r=>{
    const wd = r.weekday || '';
    const isUpdateDay = (wd==='星期三' || wd==='星期四');
    const note = isUpdateDay ? '<span class="badge badge-main" style="font-size:10px;">正片更新日</span>' : (r.note||'');
    html += `<tr><td>${esc(r.date)}</td><td>${esc(wd)}</td><td>${fmtWan(r.plays_wan)}</td>
      <td>${note}</td></tr>`;
  });
  html += `</tbody></table></div></div></div>`;

  html += `<div class="grid-2">
    <div class="card"><div class="card-header">历史里程碑</div><div class="scroll-420"><div class="timeline">`;
  hist.forEach(h=>{
    html += `<div class="tl-item"><div class="tl-date">${esc(h.date)}</div><div class="tl-event">${esc(h.event)}</div><div class="tl-detail">${esc(h.detail)}</div></div>`;
  });
  html += `</div></div></div>`;

  const byEp = {};
  ms.forEach(x=>{ (byEp[x.name] = byEp[x.name]||[]).push(x); });
  html += `<div class="card"><div class="card-header">单集5000万节点追踪</div><div class="scroll-420">`;
  Object.keys(byEp).sort((a,b)=>{
    const sa=(eps.find(e=>e.name===a)||{}).serialno||0, sb=(eps.find(e=>e.name===b)||{}).serialno||0;
    return sb-sa;  // 集层面倒序：最新一期在前
  }).forEach(name=>{
    html += `<div style="margin-bottom:10px;"><b style="color:var(--accent-light);font-size:13px;">${esc(name)}</b><div style="margin-top:4px;">`;
    byEp[name].slice().sort((a,b)=>{  // 集内节点按达成时间倒序，空值排最后
      const ta=a.achieve_time||'', tb=b.achieve_time||'';
      if(!ta) return 1; if(!tb) return -1;
      return tb.localeCompare(ta);
    }).forEach(x=>{
      const color = x.status==='confirmed'?'dot-green':(x.status==='confirmed_before_collection'?'dot-yellow':'dot-muted');
      const txt = x.achieve_time? esc(x.achieve_time) : (x.status==='confirmed_before_collection'?'采集前已达成':'未达成');
      html += `<div style="font-size:12px;padding:2px 0;"><span class="dot ${color}"></span>${x.node_yi}亿 · ${txt}</div>`;
    });
    html += `</div></div>`;
  });
  html += `</div></div></div>`;

  // ---------- 各季播放量同比对比 ----------
  if(d.seasons_compare && d.seasons_compare.rows && d.seasons_compare.rows.length){
    const sc = d.seasons_compare;
    const seasons = sc.seasons || [];
    // 第8季置首列：其余季按原序排其后
    const ordered = ['第8季', ...seasons.filter(s=>s!=='第8季')];
    // 构造统一列宽：1 列 132px + N 列自适应
    const colTemplate = '152px ' + Array(ordered.length).fill('minmax(78px, 1fr)').join(' ');
    const normalRows = sc.rows.filter(r=>!r.summary);
    const summaryRows = sc.rows.filter(r=>r.summary);
    html += `<div class="card" style="border-color:rgba(22,163,74,0.35)">
      <div class="card-header">各季播放量同比对比（单位：亿次）</div>
      <div class="sc-card">`;
    // 表头：永远固定在顶部
    html += `<div class="sc-header" style="grid-template-columns:${colTemplate}">`;
    html += `<div class="sc-cell col-fixed">内容类型</div>`;
    ordered.forEach(s=>{
      const cls = s==='第8季' ? 'col-s8' : '';
      html += `<div class="sc-cell ${cls}">${esc(s)}</div>`;
    });
    html += `</div>`;
    // 中间分集：随滚动容器纵/横滚动，首2列水平冻结不受影响
    normalRows.forEach(r=>{
      html += `<div class="sc-row" style="grid-template-columns:${colTemplate}"><div class="sc-cell col-fixed">${esc(r.type)}</div>`;
      ordered.forEach(s=>{
        const v = r.plays ? r.plays[s] : null;
        const disp = (v==null) ? '<span class="text-muted">-</span>' : fmtYi(v);
        const cls = s==='第8季' ? 'col-s8' : '';
        html += `<div class="sc-cell ${cls}">${disp}</div>`;
      });
      html += `</div>`;
    });

    // 底部汇总：垂直钉底 + 首2列水平冻结，与表头共用 colTemplate
    summaryRows.forEach(r=>{
      const label = r.summary === 'total' ? '总播放量（仅正片）'
                   : r.summary === 'avg'   ? '集均（仅正片）'
                   : esc(r.type);
      html += `<div class="sc-summary-row" style="grid-template-columns:${colTemplate}"><div class="sc-cell col-fixed">${label}</div>`;
      ordered.forEach(s=>{
        const v = r.plays ? r.plays[s] : null;
        const disp = (v==null) ? '<span class="text-muted">-</span>' : fmtYi(v);
        const cls = s==='第8季' ? 'col-s8' : '';
        html += `<div class="sc-cell ${cls}">${disp}</div>`;
      });
      html += `</div>`;
    });
    html += `</div></div>`;
  }

  html += `<div class="card" style="border-color:rgba(22,163,74,0.35)">
    <div class="card-header">密室大王来了</div>
    <div class="links-grid">
      <a class="link-card" href="https://weibo.com/n/%E6%97%B6%E4%BB%A3%E5%B0%91%E5%B9%B4%E5%9B%A2-%E5%BC%A0%E7%9C%9F%E6%BA%90" target="_blank" rel="noopener noreferrer" title="微博：时代少年团-张真源">
        <img class="link-img" src="./icons/icon-weibo.png" alt="微博" loading="lazy" />
        <span class="link-name">微博</span>
        <span class="link-sub">@时代少年团-张真源</span>
      </a>
      <a class="link-card" href="https://v.douyin.com/rWTsKxR_f0M/" target="_blank" rel="noopener noreferrer" title="抖音：张真源主页">
        <img class="link-img" src="./icons/icon-douyin.png" alt="抖音" loading="lazy" />
        <span class="link-name">抖音</span>
        <span class="link-sub">张真源 · 抖音主页</span>
      </a>
      <a class="link-card" href="https://so.mgtv.com/so?k=%E5%BC%A0%E7%9C%9F%E6%BA%90%E5%AF%86%E5%AE%A4%E5%A4%A7%E9%80%83%E8%84%B1&lastp=ch_home" target="_blank" rel="noopener noreferrer" title="芒果TV：张真源 密室大逃脱">
        <img class="link-img" src="./icons/icon-mgtv.png" alt="密室大逃脱" loading="lazy" />
        <span class="link-name">密室大逃脱</span>
        <span class="link-sub">芒果TV · 张真源搜索</span>
      </a>
    </div>
  </div>`;

  html += `<div class="card" style="border-color:rgba(22,163,74,0.35)"><div style="font-size:12px;color:var(--text-muted);">
    <b style="color:var(--accent-light)">数据来源说明</b><br>
    &bull; 数据来源：芒果TV官方API（全站播放量）＋ 猫眼专业版（平台累计/每日明细）<br>
    &bull; 猫眼数据由本机浏览器每小时自动采集后推送（云端受反爬限制，故走本机通道）<br>
    &bull; 所有数字均为实际采集值，可追溯可溯源<br>
    &bull; 本页每 ${REFRESH_SEC} 秒自动拉取最新数据
  </div></div>`;

  document.getElementById('app').innerHTML = html;
  document.getElementById('footer').innerHTML = `
    <div>
      <span style="color:var(--accent-light);">🌸</span>
      <span style="color:var(--text-muted);">版权归属：豆瓣（披萨品鉴指南小组｜源气满满  @爽姐就爽当下）</span>
    </div>`;
}

async function tick(){
  MAOYAN_INFO = null;
  try{
    const d = await load();
    const md = await fetchMaoyan();
    applyMaoyan(d, md);
    render(d);
    document.getElementById('loading').style.display='none';
    document.getElementById('error').style.display='none';
    document.getElementById('app').style.display='block';
  }catch(e){
    console.error(e);
    if(document.getElementById('app').innerHTML===''){
      document.getElementById('loading').style.display='none';
      document.getElementById('error').style.display='block';
    }
  }
}
tick();
setInterval(tick, REFRESH_SEC*1000);
</script>
